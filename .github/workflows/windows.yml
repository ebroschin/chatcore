name: CI (Windows)

on:
  push:
    branches: [ "ci/github-actions" ]
  pull_request:
    branches: [ "ci/github-actions" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja cmake -y

      - name: Prepare vcpkg cache
        shell: pwsh
        run: |
          "VCPKG_DOWNLOADS=${{ github.workspace }}\.vcpkg-downloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.vcpkg-downloads" | Out-Null

      - name: Apply vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Build
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\scripts\windows\build-all.ps1
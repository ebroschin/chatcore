name: CI

on:
  push:
    branches: [ "master", "ci/**" ]
  pull_request:
    branches: [ "master", "ci/**" ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            runner: ubuntu-24.04
            os: linux
            arch: x64
            compiler: gcc
            preset: linux-gcc-test-all

          - name: linux-x86-gcc
            runner: ubuntu-24.04
            os: linux
            arch: x86
            compiler: gcc
            preset: linux-gcc-x86-test-all

          - name: linux-x64-clang
            runner: ubuntu-24.04
            os: linux
            arch: x64
            compiler: clang
            preset: linux-clang-test-all

          - name: windows-x64-msvc
            runner: windows-latest
            os: windows
            arch: x64
            compiler: msvc
            msvc_arch: x64
            preset: windows-msvc-test-all

          - name: windows-x86-msvc
            runner: windows-latest
            os: windows
            arch: x86
            compiler: msvc
            msvc_arch: x86
            preset: windows-msvc-x86-test-all

          - name: windows-x64-clang-cl
            runner: windows-latest
            os: windows
            arch: x64
            compiler: clang-cl
            msvc_arch: x64
            preset: windows-clang-test-all

          - name: windows-x64-mingw
            runner: windows-latest
            os: windows
            arch: x64
            compiler: mingw
            preset: windows-mingw-test-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies (gcc)
        if: matrix.os == 'linux' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake \
            build-essential pkg-config \
            autoconf autoconf-archive automake libtool \
            zip unzip curl ca-certificates git

      - name: Install Linux x86 multilib
        if: matrix.os == 'linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib \
            libc6-dev-i386

      - name: Install Linux dependencies (clang)
        if: matrix.os == 'linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake \
            clang clang-tidy \
            build-essential pkg-config \
            autoconf autoconf-archive automake libtool \
            zip unzip curl ca-certificates git

      - name: Setup MSVC
        if: matrix.compiler == 'msvc' || matrix.compiler == 'clang-cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Windows dependencies (msvc)
        if: matrix.compiler == 'msvc'
        run: choco install ninja cmake -y

      - name: Install Windows dependencies (clang-cl)
        if: matrix.compiler == 'clang-cl'
        run: choco install llvm ninja cmake -y

      - name: Install Windows dependencies (mingw)
        if: matrix.compiler == 'mingw'
        run: choco install mingw ninja cmake -y

      - name: Prepare vcpkg cache (Linux)
        if: matrix.os == 'linux'
        run: |
          echo "VCPKG_DOWNLOADS=${{ github.workspace }}/.vcpkg-downloads" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/.vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_FEATURE_FLAGS=binarycaching" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/.vcpkg-downloads"
          mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      - name: Prepare vcpkg cache (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "VCPKG_DOWNLOADS=${{ github.workspace }}\.vcpkg-downloads" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_FEATURE_FLAGS=binarycaching" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.vcpkg-downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.vcpkg-cache" | Out-Null

      - name: Apply vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Build and run tests (Linux)
        if: matrix.os == 'linux'
        run: bash scripts/linux/test-all.sh ${{ matrix.preset }}

      - name: Build and run tests (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\scripts\windows\test-all.ps1 -Preset ${{ matrix.preset }}

name: CI (Linux)

on:
  push:
    branches: [ "ci/github-actions" ]
  pull_request:
    branches: [ "ci/github-actions" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

          sudo apt-get install -y ninja-build cmake

      - name: Prepare vcpkg cache
        run: |
          echo "VCPKG_DOWNLOADS=${{ github.workspace }}/.vcpkg-downloads" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/.vcpkg-downloads"

      - name: Apply vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Build
        env:
          CC: clang-20
          CXX: clang++-20
        run: bash scripts/linux/build-all.sh